aid: devoted
name: Devoted Health
description: >-
  Devoted Health is a technology-enabled Medicare Advantage payer founded in 2017 and
  headquartered in Waltham, Massachusetts, backed by General Catalyst and Obvious Ventures.
  It publishes CMS-required interoperability APIs built on HL7 FHIR R4: a member-facing
  Patient Access API exposing claims (ExplanationOfBenefit), encounters, conditions, and
  medications; a public Provider & Pharmacy Directory API (Da Vinci PDEX Plan-Net); and a
  public Plan Coverage & Formularies API (PDEX US Drug Formulary). Member data access uses
  OAuth 2.0 / OpenID Connect with member consent under the 21st Century Cures Act, and
  third-party applications register with the interoperability team to receive credentials.
